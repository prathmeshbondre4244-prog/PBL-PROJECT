<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSRTC SmartTrack — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef3f8,#dfe8f2);color:#17202a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:430px;background:#fff;border-radius:26px;padding:30px;box-shadow:0 18px 50px #17202a22}
.logo{width:58px;height:58px;border-radius:17px;background:#18212f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:15px}
h1{margin:0;font-size:27px}.sub{color:#667085;font-size:13px;margin:7px 0 25px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.role{border:1px solid #d9dee6;background:#f8fafc;border-radius:12px;padding:11px 5px;cursor:pointer;text-align:center;font-weight:700;font-size:12px}
.role.active{background:#18212f;color:white;border-color:#18212f}
label{font-size:12px;font-weight:700;display:block;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #d9dee6;border-radius:12px;font-size:14px;outline:none}
input:focus{border-color:#18212f}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#18212f;color:white;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}
.msg{display:none;margin-top:14px;padding:11px;border-radius:11px;font-size:13px}.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.demo{margin-top:18px;padding:13px;background:#f4f6f8;border-radius:13px;font-size:11px;color:#667085;line-height:1.6}
.back{text-align:center;margin-top:18px;font-size:12px}.back a{color:#18212f;font-weight:700;text-decoration:none}
</style></head>
<body>
<div class="box">
<div class="logo">🚌</div>
<h1>MSRTC SmartTrack</h1>
<div class="sub">Smart Real-Time Bus Tracking & Route Optimization</div>
<div class="roles">
<button class="role active" data-role="passenger">👤<br>Passenger</button>
<button class="role" data-role="driver">🚌<br>Driver</button>
<button class="role" data-role="admin">🛠️<br>Admin</button>
</div>
<form id="form">
<label>Email / User ID</label><input id="email" type="email" placeholder="Enter your email" required>
<label>Password</label><input id="password" type="password" placeholder="Enter password" required>
<button class="btn" type="submit">Login →</button>
</form>
<div id="msg" class="msg"></div>
<div class="demo"><b>Demo accounts</b><br>
Passenger: passenger@msrtc.com / passenger123<br>
Driver: driver@msrtc.com / driver123<br>
Admin: admin@msrtc.com / admin123</div>
<div class="back"><a href="/register">New passenger? Create account</a><br><br><a href="/">Continue as Passenger Demo</a></div>
</div>
<script>
let role='passenger';
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));
 b.classList.add('active'); role=b.dataset.role;
});
document.getElementById('form').onsubmit=async e=>{
 e.preventDefault(); const msg=document.getElementById('msg'); msg.style.display='none';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({email:email.value,password:password.value,role})});
  const d=await r.json();
  if(!d.success){msg.className='msg error';msg.textContent=d.message;msg.style.display='block';return;}
  localStorage.setItem('msrtc_user',JSON.stringify(d));
  msg.className='msg ok';msg.textContent='Login successful. Opening dashboard...';msg.style.display='block';
  setTimeout(()=>{location.href=role==='admin'?'/dashboard/':role==='driver'?'/driver/':'/';},500);
 }catch(err){msg.className='msg error';msg.textContent='Server is not running. Start python run.py first.';msg.style.display='block';}
};
</script>
</body></html>
