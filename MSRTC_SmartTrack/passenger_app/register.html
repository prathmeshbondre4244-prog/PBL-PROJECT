<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mazi ST | Sign Up</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#edf3f9;color:#17243c;margin:0}header{background:#123a6b;color:white;padding:22px}main{max-width:720px;margin:25px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 25px #11223316}label{display:block;font-weight:650;margin:14px 0 5px}input,select{width:100%;padding:12px;border:1px solid #bfcbd9;border-radius:9px}button,.btn{background:#1263a5;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;display:inline-block;text-decoration:none;margin-top:14px}a{color:#1263a5}header a{color:white}.note{background:#fff4d8;padding:12px;border-radius:9px}#msg{margin-top:12px}</style></head><body><header><a href="/login">← Login</a><h1>Create Passenger Account</h1></header><main><div class="card"><p>Enter details once. Your details will be saved in your passenger profile.</p><form id="form"><label>Full name</label><input id="name" required maxlength="100"><label>Email</label><input id="email" type="email" required><label>Password (at least 8 characters)</label><input id="password" type="password" minlength="8" required><label>Date of birth</label><input id="dob" type="date" required><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="undisclosed">Prefer not to say</option></select><label><input id="card" type="checkbox" style="width:auto"> I have an eligible concession card (self-reported; not verified)</label><p class="note">Demo system: this does not verify MSRTC concession eligibility. Do not enter real identity-card numbers.</p><button type="submit">Create account</button></form><div id="msg"></div></div></main><script>document.getElementById('dob').max=new Date().toISOString().slice(0,10);document.getElementById('form').onsubmit=async e=>{e.preventDefault();const body={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,date_of_birth:document.getElementById('dob').value,gender:document.getElementById('gender').value,concession_card:document.getElementById('card').checked};const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('msg').textContent=r.ok?'Account created! Redirecting to login...':(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));if(r.ok)setTimeout(()=>location.href='/login',1000)}</script></body></html>
