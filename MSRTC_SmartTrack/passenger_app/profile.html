<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mazi ST | Profile</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#edf3f9;color:#17243c;margin:0}header{background:#123a6b;color:white;padding:22px}main{max-width:720px;margin:25px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 25px #11223316}label{display:block;font-weight:650;margin:14px 0 5px}input,select{width:100%;padding:12px;border:1px solid #bfcbd9;border-radius:9px}button,.btn{background:#1263a5;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;display:inline-block;text-decoration:none;margin-top:14px}a{color:#1263a5}header a{color:white}.note{background:#fff4d8;padding:12px;border-radius:9px}#msg{margin-top:12px}</style></head><body><header><a href="/">← Home</a><h1>My Passenger Profile</h1></header><main><div class="card"><form id="form"><label>Name</label><input id="name" required><label>Date of birth</label><input id="dob" type="date" required><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="undisclosed">Prefer not to say</option></select><label><input id="card" type="checkbox" style="width:auto"> Concession card claimed (not verified)</label><button>Save profile</button></form><div id="msg"></div></div></main><script>const u=JSON.parse(localStorage.getItem('msrtc_user')||'null');if(!u?.token)location.replace('/login');const headers={'Authorization':'Bearer '+u?.token};async function load(){const r=await fetch('/api/profile',{headers});if(!r.ok){location.replace('/login');return}const p=await r.json();document.getElementById('name').value=p.name;document.getElementById('dob').value=p.date_of_birth;document.getElementById('gender').value=p.gender;document.getElementById('card').checked=p.concession_card}load();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/profile',{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,date_of_birth:document.getElementById('dob').value,gender:document.getElementById('gender').value,concession_card:document.getElementById('card').checked})});document.getElementById('msg').textContent=r.ok?'Profile saved': 'Could not save profile';if(r.ok){u.name=document.getElementById('name').value;localStorage.setItem('msrtc_user',JSON.stringify(u))}}</script></body></html>
