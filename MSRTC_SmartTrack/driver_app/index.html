<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSRTC Driver GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:Arial;background:#eef2f7;margin:0}.app{max-width:500px;margin:auto;background:white;min-height:100vh;padding:20px}.card{padding:18px;border-radius:18px;box-shadow:0 5px 20px #0001;margin:15px 0}button{width:100%;padding:14px;border:0;border-radius:12px;margin:7px 0;font-weight:bold}#map{height:400px;border-radius:18px}.start{background:#18212f;color:white}.stop{background:#eee}</style></head><body><div class="app"><h1>🚌 Driver GPS</h1><div class="card"><h2>MH-12 AB-1234</h2><p>Pune → Mumbai</p><p id="gps">GPS waiting...</p><b id="status">● GPS OFF</b></div><div id="map"></div><button class="start" onclick="start()">▶ Start GPS Simulation</button><button class="stop" onclick="stop()">⏸ Stop</button><p>This page simulates the GPS device/driver phone. Passenger tracking receives the same coordinates from the backend.</p></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const p=[[18.5284,73.8739],[18.5196,73.8719],[18.5100,73.8675],[18.5018,73.8636],[18.4900,73.8645],[18.4750,73.8660],[18.4620,73.8670],[18.4529,73.8662],[18.6200,73.7000],[18.7000,73.5600],[18.7481,73.4072]];let i=0,t=null;let m=L.map('map').setView(p[0],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);let marker=L.marker(p[0]).addTo(m);L.polyline(p).addTo(m);async function send(){let [lat,lon]=p[i];let d={bus_id:'MH12AB1234',latitude:lat,longitude:lon,speed:i>7?55:42,eta:Math.max(3,18-i),status:i===5?'DELAYED':'ON_TIME',current_stop:i<3?'Pune':i<6?'Swargate':i<9?'Katraj':'Lonavala'};await fetch('/api/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});marker.setLatLng([lat,lon]);document.getElementById('gps').textContent='GPS: '+lat.toFixed(4)+', '+lon.toFixed(4);document.getElementById('status').textContent='● GPS ACTIVE';i=(i+1)%p.length}function start(){if(t)return;send();t=setInterval(send,2000)}function stop(){clearInterval(t);t=null;document.getElementById('status').textContent='● GPS PAUSED'}</script><p><a href="/login">Logout / Switch User</a></p></body></html>
